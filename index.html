<meta charset="utf-8">
<title>Stellar Horizons Solo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jura:wght@500;700&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: full-screen star chart (canvas) with a command rail on the right and a status strip on top; phone: rail becomes a bottom sheet. Single dark look by design: the board art is a black starfield. */
:root {
  --void: #05080d; --hull: #0d141d; --hull2: #142030; --line: #263a50; --ink: #dfe7ee; --dim: #8ea1b3;
  --beacon: #f2a93b; --ion: #4fc3d9; --ok: #5fcf8a; --warn: #f2a93b; --bad: #ef6b5b;
  --phy: #4f9be6; --eng: #a9b4bf; --bio: #5fcf8a;
  --f-disp: "Jura", "Eurostile", "Segoe UI", sans-serif; --f-body: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif; --f-mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--void); color: var(--ink); font: 15px/1.45 var(--f-body); overflow: hidden; }
#app { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr; padding-top: env(safe-area-inset-top, 0px); }
#bar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; padding: 8px 16px; background: var(--hull); border-bottom: 1px solid var(--line); font-size: 13px; }
#bar .yr { font: 700 22px/1 var(--f-disp); letter-spacing: .06em; color: var(--beacon); }
#bar .ph { font: 600 13px var(--f-disp); letter-spacing: .12em; text-transform: uppercase; color: var(--ion); }
#bar .st { color: var(--dim); white-space: nowrap; } #bar .st b { color: var(--ink); font: 500 13px var(--f-mono); font-variant-numeric: tabular-nums; }
#bar .grow { flex: 1; }
#main { position: relative; display: grid; grid-template-columns: 1fr minmax(340px, 400px); min-height: 0; }
#stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--void); touch-action: none; }
#stage canvas { display: block; }
#zoom { position: absolute; left: 16px; bottom: 16px; display: flex; gap: 6px; }
#hint { position: absolute; left: 16px; top: 12px; right: 16px; pointer-events: none; font-size: 13px; color: var(--dim); text-shadow: 0 1px 2px #000; }
#rail { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; background: var(--hull); border-left: 1px solid var(--line); }
#tabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
#tabs button { flex: 1; padding: 9px 4px; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--dim); font: 600 12px var(--f-disp); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; }
#tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--beacon); }
#panel { overflow-y: auto; padding: 14px 16px 24px; min-height: 0; }
#foot { display: flex; gap: 8px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); background: var(--hull2); }
#foot .next { flex: 1; }
h2 { font: 700 17px/1.2 var(--f-disp); letter-spacing: .05em; margin: 0 0 6px; text-wrap: balance; }
h3 { font: 600 12px var(--f-disp); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin: 16px 0 6px; }
p { margin: 0 0 8px; } .dim { color: var(--dim); font-size: 13px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
button.b { font: 600 13px var(--f-body); padding: 7px 11px; border-radius: 4px; border: 1px solid var(--line); background: var(--hull2); color: var(--ink); cursor: pointer; }
button.b:hover:not(:disabled) { border-color: var(--ion); }
button.b.pri { background: var(--beacon); border-color: var(--beacon); color: #1b1203; }
button.b:disabled { opacity: .4; cursor: not-allowed; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--ion); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; }
.item { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.item .t { min-width: 0; } .item .t small { display: block; color: var(--dim); font-size: 12px; }
.chip { display: inline-block; padding: 1px 7px; border-radius: 10px; font: 600 11px var(--f-body); letter-spacing: .04em; border: 1px solid var(--line); color: var(--dim); }
.chip.ok { color: var(--ok); border-color: var(--ok); } .chip.warn { color: var(--warn); border-color: var(--warn); } .chip.bad { color: var(--bad); border-color: var(--bad); }
.f-Phy { color: var(--phy); } .f-Eng { color: var(--eng); } .f-Bio { color: var(--bio); }
.cnt { width: 40px; height: 40px; border-radius: 4px; background-repeat: no-repeat; flex: none; }
.rs { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 3px; font: 700 11px/1 var(--f-mono); color: #fff; vertical-align: middle; }
.rs.ORE { background: #6b7178; clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); } .rs.SUP { background: #2c7cc4; border-radius: 50%; } .rs.FUEL { background: linear-gradient(#f5b62a, #d9411e); border-radius: 50% 50% 45% 45%; }
table { border-collapse: collapse; width: 100%; font-size: 13px; } td, th { padding: 4px 6px; border-top: 1px solid var(--line); text-align: left; } th { color: var(--dim); font-weight: 500; }
.tech { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 6px 0; border-top: 1px solid var(--line); }
.tech small { color: var(--dim); font-size: 12px; grid-column: 1 / -1; }
.tech.have b { color: var(--ok); } .tech.locked { opacity: .55; }
#log p { font-size: 13px; margin: 0 0 6px; color: var(--dim); } #log p.g { color: var(--ink); } #log p.x { color: var(--bad); } #log p.e { color: var(--warn); } #log p.h { color: var(--ion); font-family: var(--f-disp); letter-spacing: .06em; margin-top: 12px; }
#modal { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(2,4,8,.7); z-index: 20; padding: 16px; }
#modal .box { max-width: 460px; width: 100%; background: var(--hull); border: 1px solid var(--beacon); border-radius: 6px; padding: 18px; max-height: 85vh; overflow: auto; }
#pick { position: fixed; inset: 0; overflow: auto; background: radial-gradient(ellipse at 30% 20%, #10213a 0, var(--void) 60%); z-index: 30; padding: 32px 16px; }
#pick .in { max-width: 920px; margin: 0 auto; }
#pick h1 { font: 500 clamp(32px, 6vw, 58px)/1 var(--f-disp); letter-spacing: .32em; margin: 0 0 6px; text-transform: uppercase; }
#pick .lede { color: var(--dim); max-width: 62ch; margin-bottom: 22px; }
.facs { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.fc { text-align: left; background: var(--hull); border: 1px solid var(--line); border-radius: 6px; padding: 14px; color: var(--ink); cursor: pointer; font: inherit; display: grid; gap: 6px; }
.fc:hover { border-color: var(--beacon); } .fc b { font: 700 16px var(--f-disp); letter-spacing: .04em; } .fc small { color: var(--dim); font-size: 13px; }
.fc .sw { height: 4px; border-radius: 2px; }
#toast { position: absolute; left: 50%; bottom: 70px; transform: translateX(-50%); background: var(--hull2); border: 1px solid var(--bad); color: var(--ink); padding: 8px 14px; border-radius: 4px; font-size: 13px; max-width: 80%; z-index: 5; }
#lvpick { position: absolute; z-index: 6; background: var(--hull); border: 1px solid var(--ion); border-radius: 6px; padding: 10px; display: grid; gap: 6px; }
.die { display: inline-grid; place-items: center; width: 52px; height: 52px; border-radius: 10px; font: 700 28px var(--f-mono); background: var(--hull2); border: 2px solid var(--line); flex: none; }
/* d100 face: round, smaller digits so 100 fits */
.die.d100 { border-radius: 50%; font-size: 21px; }
.die.ok { border-color: var(--ok); color: var(--ok); } .die.bad { border-color: var(--bad); color: var(--bad); }
#menu { position: fixed; inset: 0; z-index: 40; background: #02040a; overflow: hidden; }
#menu::before { content: ""; position: absolute; inset: -40px; background: url(menu.webp) center / cover; filter: blur(28px) brightness(.55); }
#menu .stage { position: absolute; transform-origin: 30% 58%; animation: kb 46s ease-in-out infinite alternate; }
@keyframes kb { from { transform: scale(1); } to { transform: scale(1.045) translate(-0.6%, 0.4%); } }
#menu img, #menu canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#menu .mb { position: absolute; background: transparent; border: 0; cursor: pointer; clip-path: polygon(6% 0, 94% 0, 100% 50%, 94% 100%, 6% 100%, 0 50%); }
#menu .mb::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(140,220,255,.38) 50%, transparent 70%); background-size: 260% 100%; background-position: 130% 0; opacity: 0; transition: opacity .2s; }
#menu .mb:hover::after, #menu .mb:focus-visible::after { opacity: 1; animation: sweep 1.1s ease-out; }
#menu .mb:hover, #menu .mb:focus-visible { box-shadow: inset 0 0 22px rgba(79,195,217,.55); outline: none; }
@keyframes sweep { from { background-position: 130% 0; } to { background-position: -30% 0; } }
#menu .panel { position: absolute; z-index: 3; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(520px, calc(100% - 32px)); max-height: calc(100% - 48px); overflow: auto; background: rgba(8,16,30,.92); border: 1px solid #3aa6d8; box-shadow: 0 0 40px rgba(58,166,216,.35); border-radius: 8px; padding: 20px; }
.slot { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.slot small { color: var(--dim); display: block; font-size: 12px; }
#pause { position: fixed; inset: 0; z-index: 35; display: grid; place-items: center; background: rgba(2,5,12,.72); backdrop-filter: blur(3px); padding: 16px; }
#pause .box { width: min(420px, 100%); max-height: calc(100% - 32px); overflow: auto; background: var(--hull); border: 1px solid #3aa6d8; border-radius: 8px; padding: 20px; box-shadow: 0 0 40px rgba(58,166,216,.3); }
#pause .big { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 11px 14px; font: 600 14px var(--f-disp); letter-spacing: .14em; text-transform: uppercase; }
#pause h2 { letter-spacing: .3em; text-transform: uppercase; font-weight: 500; }
#bar .pz { font: 600 12px var(--f-disp); letter-spacing: .12em; padding: 5px 10px; }
.toggle { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.board-img { width: 100%; border-radius: 4px; border: 1px solid var(--line); }
@media (max-width: 820px) {
  #main { grid-template-columns: 1fr; grid-template-rows: 1fr minmax(260px, 46%); }
  #rail { border-left: 0; border-top: 1px solid var(--line); }
  #bar { gap: 2px 12px; padding: 6px 16px; } #bar .yr { font-size: 18px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
/* technology tree (dark take on the printed Technology Tree) */
#ttree { position: absolute; inset: 0; z-index: 20; overflow: auto; touch-action: pan-x pan-y; background: #070b11; overscroll-behavior: contain; }
#ttree[hidden] { display: none !important; }
#ttree .tt-wrap { position: relative; margin: 0 auto; }
#ttree .band { position: absolute; left: 0; right: 0; }
#ttree .band.Bio { background: linear-gradient(90deg, #1f2a12, #141b0e 40%, #10150c); }
#ttree .band.Phy { background: linear-gradient(90deg, #13223a, #0e1829 40%, #0b1320); }
#ttree .band.Eng { background: linear-gradient(90deg, #22262c, #191c21 40%, #131619); }
#ttree .band + .band { border-top: 1px solid #2a3a4c; }
#ttree .blabel { position: absolute; left: 0; width: 64px; display: grid; place-items: center; }
#ttree .blabel span { writing-mode: vertical-rl; transform: rotate(180deg); font: 700 30px var(--f-disp); letter-spacing: .14em; text-transform: uppercase; }
#ttree .blabel.Bio span { color: #b5c46a; } #ttree .blabel.Phy span { color: #7fb2f0; } #ttree .blabel.Eng span { color: #b9c2cc; }
#ttree svg { position: absolute; left: 0; top: 0; pointer-events: none; }
#ttree .tcard { position: absolute; display: flex; flex-direction: column; gap: 3px; padding: 6px 8px 6px; border-radius: 6px; background: #0f1722; border: 1px solid #2b3d52; box-shadow: 0 2px 8px rgba(0,0,0,.5); cursor: pointer; text-align: left; color: var(--ink); font: 12px/1.25 var(--f-body); }
#ttree .tcard .tn { display: flex; align-items: flex-start; gap: 6px; font: 700 12.5px/1.15 var(--f-disp); letter-spacing: .02em; }
#ttree .tcard .tn b { flex: 1; font: inherit; }
#ttree .tcard .tc { flex: none; min-width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 700 12px var(--f-mono); color: #fff; border: 2px solid rgba(255,255,255,.35); }
#ttree .tcard.Bio .tc { background: #6f7d2c; } #ttree .tcard.Phy .tc { background: #2f69b3; } #ttree .tcard.Eng .tc { background: #59626d; }
#ttree .tcard .tc s { font-size: 9px; opacity: .7; margin-right: 1px; }
#ttree .tcard .td { color: var(--dim); font-size: 11.5px; flex: 1; }
#ttree .tcard .tf { display: flex; gap: 3px; flex-wrap: wrap; }
#ttree .tcard .tf i { font: 700 9px/1 var(--f-mono); font-style: normal; padding: 2px 3px; border-radius: 2px; color: #fff; }
#ttree .tcard.have { border-color: var(--ok); background: #10201a; } #ttree .tcard.have .tn b::after { content: " ✓"; color: var(--ok); }
#ttree .tcard.open { border-color: #4a6684; } #ttree .tcard.ready { border-color: var(--beacon); box-shadow: 0 0 0 1px var(--beacon), 0 0 14px rgba(242,169,59,.35); }
#ttree .tcard.locked { opacity: .55; }
#ttree .tcard:hover { border-color: var(--ion); opacity: 1; }
#ttree .tt-top { position: sticky; left: 0; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding: 10px 16px; background: rgba(7,11,17,.92); border-bottom: 1px solid var(--line); font-size: 13px; }
#ttree .tt-top h2 { margin: 0; font-size: 18px; letter-spacing: .2em; text-transform: uppercase; }
#ttree .tt-top .sp { flex: 1; }
#ttree .key { display: inline-flex; align-items: center; gap: 5px; color: var(--dim); }
#ttree .key i { width: 14px; height: 10px; border-radius: 2px; border: 2px solid; display: inline-block; }
#pick .scen { display: grid; gap: 8px; margin: 14px 0 6px; }
#pick .scen .sc { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--hull); cursor: pointer; }
#pick .scen .sc:has(input:checked) { border-color: var(--beacon); }
#pick .scen .sc input { margin-top: 3px; accent-color: var(--beacon); }
#pick .scen .sc span { display: grid; gap: 2px; } #pick .scen small { color: var(--dim); font-size: 12.5px; }
#mbox .cargo, #panel .cargo { margin: 8px 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--hull2); }
.cargo .sl { display: grid; grid-template-columns: auto 44px 1fr 28px; align-items: center; gap: 8px; margin: 4px 0; font-size: 13px; }
.cargo input[type=range] { width: 100%; accent-color: #e8892f; }
.hexc { display: inline-grid; place-items: center; min-width: 26px; height: 22px; padding: 0 4px; font: 700 11px/1 var(--f-mono); color: #fff; background: #d9772a; clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); vertical-align: middle; }
</style>

<div id="app">
  <div id="bar"></div>
  <div id="main">
    <div id="stage"><div id="hint"></div>
      <div id="zoom"><button class="b" id="zin" aria-label="Zoom in">+</button><button class="b" id="zout" aria-label="Zoom out">−</button><button class="b" id="zfit">Whole map</button><button class="b" id="zme">My ships</button></div>
    </div>
    <div id="ttree" hidden></div>

      <nav id="tabs" role="tablist"></nav>

    </aside>
  </div>
</div>
<div id="pick" hidden></div>
<div id="menu" hidden><div class="stage" id="mstage"><img id="mimg" src="menu.webp" alt="Stellar Horizons title screen"><canvas id="mfx"></canvas><div id="mbtns"></div></div><div id="mpanel"></div></div>
<div id="pause" hidden><div class="box" id="pbox"></div></div>
<div id="modal" hidden><div class="box" id="mbox"></div></div>

<script src="data.js"></script>
<script src="rules.js"></script>
<script>
'use strict';
const D = window.SHD;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let ui = null, E, G = null, GEO, ATL = {}, MK, UNITS, sel = null, tab = 'turn', toastT;
const CS = 62; // counter size on the board (world px)
const RS = (r, n) => `<span class="rs ${r}" title="${r}">${n}</span>`;
// orange hexagon = cargo capacity (gear when it can also produce), as on the counters
const cargoHex = s => `<span class="hexc" title="Cargo capacity${s.prod ? ' and production' : ''}">${s.cap * E.cargoMul(G)}${s.prod ? '⚙' : ''}</span>`;
// one slider per resource; the three together never exceed the hold's free room. extra() = other Earth costs to add (e.g. a new LV)
function cargoSliders(s, id) {
  const room = s.cap * E.cargoMul(G) - E.sum(s.cargo);
  return `<div class="cargo" id="${id}" data-room="${room}"><p class="dim" style="margin:0 0 4px">${cargoHex(s)} Load cargo on Earth: ${room} free. Resources on your faction board are used first, the rest is bought at $1B each.</p>
    ${['ORE', 'SUP', 'FUEL'].map(r => `<label class="sl">${RS(r, '')}<span>${r}</span><input type="range" min="0" max="${room}" value="0" data-r="${r}"><b class="mono" data-v="${r}">0</b></label>`).join('')}
    <p class="dim" data-cost style="margin:4px 0 0"></p></div>`;
}
function wireCargo(box, extra, onChange) {
  const el = box.querySelector('.cargo'); if (!el) return () => null;
  const room = +el.dataset.room, ins = [...el.querySelectorAll('input[type=range]')];
  const load = () => Object.fromEntries(ins.map(i => [i.dataset.r, +i.value]));
  const upd = moved => {
    let tot = ins.reduce((a, i) => a + +i.value, 0);
    if (tot > room && moved) moved.value = +moved.value - (tot - room);
    ins.forEach(i => el.querySelector(`[data-v="${i.dataset.r}"]`).textContent = i.value);
    const L = load(), all = { ...L }, x = extra ? extra() : null; if (x) Object.keys(x).forEach(r => all[r] = (all[r] || 0) + x[r]);
    const cash = E.earthCash(G, all), ok = cash <= G.cash;
    el.querySelector('[data-cost]').innerHTML = E.sum(L) ? `Cargo ${resHTML(L)}${x && E.sum(x) ? ' plus the new launch vehicle' : ''}: <b style="color:${ok ? 'var(--ink)' : 'var(--bad)'}">${esc(E.earthCostTxt(G, all))}</b>${ok ? '' : ` (you have $${G.cash}B)`}` : 'No cargo.';
    if (onChange) onChange(ok);
  };
  ins.forEach(i => i.oninput = () => upd(i)); upd();
  return () => { upd(); return load(); };
}
const resHTML = o => ['ORE', 'SUP', 'FUEL'].filter(r => o[r]).map(r => RS(r, o[r])).join(' ') || '<span class="dim">none</span>';

function toast(msg) { if (!msg) return; let t = $('toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; $('stage').appendChild(t); } t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 4200); }
function act(fn) { const r = fn(); if (typeof r === 'string') toast(r); save(); render(); }
function save() { try { if (G) localStorage.setItem('sh-save', JSON.stringify(G)); } catch (e) {} }
function load() { try { const s = localStorage.getItem('sh-save'); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
// save slots: 'sh-save' is the autosave; three manual slots
const SLOTS = ['sh-save', 'sh-slot-1', 'sh-slot-2', 'sh-slot-3'];
const slotName = k => k === 'sh-save' ? 'Autosave' : 'Slot ' + k.slice(-1);
function readSlot(k) { try { const s = localStorage.getItem(k); if (!s) return null; const g = JSON.parse(s); return g && g.v === 2 ? g : null; } catch (e) { return null; } }
function slotInfo(g) { if (!g) return 'Empty'; return `${D.FAC[g.f].n} · ${g.over ? 'finished ' + g.endYear : g.y + ' · ' + E.PHASE_NAME[g.phase]} · ${g.savedAt ? new Date(g.savedAt).toLocaleString() : ''}`; }
function saveSlot(k) { try { G.savedAt = Date.now(); localStorage.setItem(k, JSON.stringify(G)); save(); return true; } catch (e) { return false; } }
const SET = (() => { try { return JSON.parse(localStorage.getItem('sh-settings')) || {}; } catch (e) { return {}; } })();
SET.anim = SET.anim !== false; SET.rerolls = SET.rerolls !== false; SET.scrap = !!SET.scrap;
function saveSettings() { try { localStorage.setItem('sh-settings', JSON.stringify(SET)); } catch (e) {} }

// ---------------- boot ----------------
const IMG = {}; let cv, ctx, cam = { x: 0, y: 0, s: .2 }, dirty = true, hits = [], dragS = null, targets = null;
const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Could not load ' + src)); i.src = src; });
async function boot() {
  const j = u => fetch(u).then(r => { if (!r.ok) throw new Error('Could not load ' + u); return r.json(); });
  IMG.life = await loadImg('lifemk.webp');
  [GEO, UNITS, MK, FX.bodies, FX.sun, FX.exp] = await Promise.all([j('geo.json'), j('units.json'), j('markers.json'), j('bodies.json'), j('sun.json'), j('expbox.json')]);

// ---- technology tree overlay ----
const TT = { lab: 64, cw: 178, ch: 92, gx: 30, gy: 16, pad: 14 };
function techTreeHTML() {
  const { lab, cw, ch, gx, gy, pad } = TT, colW = cw + gx, rowH = ch + gy;
  const W = lab + pad + 7 * colW, H = 12 * rowH + pad * 2, can = G.estep === 'tech';
  const X = c => lab + pad + c * colW, Y = r => pad + r * rowH + Math.floor(r / 4) * 0;
  const P = k => D.TECH_POS[k];
  const box = k => { const [r, c] = P(k); return { x: X(c), y: Y(r), w: cw, h: ch }; };
  const cards = D.TECH.map(t => box(t.k));
  const hitsCard = (x0, y0, x1, y1, skip) => cards.some((b, i) => !skip.includes(D.TECH[i].k) && Math.max(x0, x1) > b.x - 2 && Math.min(x0, x1) < b.x + b.w + 2 && Math.max(y0, y1) > b.y - 2 && Math.min(y0, y1) < b.y + b.h + 2);
  // spread several lines entering / leaving the same card
  const ins = {}, outs = {};
  D.TECH.forEach(t => t.r.forEach(r => { (ins[t.k] = ins[t.k] || []).push(r); (outs[r] = outs[r] || []).push(t.k); }));
  const sortBy = (arr, key) => arr.sort((a, b) => P(a)[0] - P(b)[0] || P(a)[1] - P(b)[1]);
  Object.values(ins).forEach(a => sortBy(a)); Object.values(outs).forEach(a => sortBy(a));
  const slot = (list, k, h) => { const n = list.length, i = list.indexOf(k); return n < 2 ? h / 2 : h / 2 + (i - (n - 1) / 2) * Math.min(14, (h - 24) / (n - 1)); };
  let paths = '';
  D.TECH.forEach(t => t.r.forEach(rk => {
    const a = box(rk), b = box(t.k), skip = [rk, t.k], lit = !!G.tech[rk];
    const col = lit ? (D.TECHK[rk].f === 'Bio' ? '#a9bd52' : D.TECHK[rk].f === 'Phy' ? '#5ea4f2' : '#c3ccd6') : '#3a4a5c';
    let d;
    if (P(rk)[1] === P(t.k)[1]) { const x = a.x + a.w / 2; d = `M${x},${a.y + a.h}V${b.y}`; }
    else {
      const y0 = a.y + slot(outs[rk], t.k, a.h), y1 = b.y + slot(ins[t.k], rk, b.h), x0 = a.x + a.w, x1 = b.x;
      const gOut = x0 + gx / 2 + ((outs[rk].indexOf(t.k) % 3) - 1) * 4, gIn = x1 - gx / 2 + ((ins[t.k].indexOf(rk) % 3) - 1) * 4;
      if (!hitsCard(x0, y0, gIn, y0, skip) && !hitsCard(gIn, y0, gIn, y1, skip)) d = `M${x0},${y0}H${gIn}V${y1}H${x1}`;
      else if (!hitsCard(gOut, y0, gOut, y1, skip) && !hitsCard(gOut, y1, x1, y1, skip)) d = `M${x0},${y0}H${gOut}V${y1}H${x1}`;
      else {
        // through the gutter between rows next to the target
        const gy0 = b.y + (y1 > y0 ? -gy / 2 : b.h + gy / 2);
        d = `M${x0},${y0}H${gOut}V${gy0}H${gIn}V${y1}H${x1}`;
      }
    }
    paths += `<path d="${d}" stroke="${col}" stroke-width="${lit ? 2.6 : 2}" fill="none" stroke-linejoin="round" ${lit ? '' : 'stroke-dasharray="1 0"'}/>`;
    const ex = P(rk)[1] === P(t.k)[1] ? null : [b.x, b.y + slot(ins[t.k], rk, b.h)];
    if (ex) paths += `<path d="M${ex[0] - 7},${ex[1] - 4.5}L${ex[0]},${ex[1]}L${ex[0] - 7},${ex[1] + 4.5}Z" fill="${col}"/>`;
  }));
  const bands = ['Bio', 'Phy', 'Eng'].map((f, i) => `<div class="band ${f}" style="top:${Y(i * 4) - pad / 2 + (i ? 0 : -pad / 2)}px;height:${4 * rowH + (i === 2 ? pad : 0)}px"></div><div class="blabel ${f}" style="top:${Y(i * 4)}px;height:${4 * rowH - gy}px"><span>${E.FN[f]}</span></div>`).join('');
  const cardsH = D.TECH.map(t => {
    const b = box(t.k), st = E.techState(G, t), c = E.techCost(G, t), ready = can && st === 'open' && G.bank[t.f] >= c;
    const holders = E.techHolders(G, t).concat((D.FAC[G.f].st || []).includes(t.k) ? [G.f] : []);
    const cost = st === 'have' ? '✓' : c < t.c ? `${c}` : t.c;
    return `<button class="tcard ${t.f} ${st}${ready ? ' ready' : ''}" data-tt="${t.k}" style="left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px" title="${esc(t.n + ' — ' + t.d + (st === 'have' ? '' : '. Cost ' + c + ' (' + E.techCostTxt(G, t) + ')'))}">
      <span class="tn"><b>${esc(t.n)}</b><span class="tc">${st !== 'have' && c < t.c ? `<s>${t.c}</s>` : ''}${cost}</span></span>
      <span class="td">${esc(t.d)}</span>
      ${holders.length ? `<span class="tf">${holders.map(f => `<i style="background:${D.FAC[f].c}" title="${esc(D.FAC[f].n)}">${esc(D.FAC[f].pre)}</i>`).join('')}</span>` : ''}
    </button>`;
  }).join('');
  return `<div class="tt-top"><h2>Technology Tree</h2>${E.FIELDS.map(f => `<span class="f-${f}">${E.FN[f]} <b class="mono">${G.bank[f]}</b></span>`).join('')}<span class="sp"></span>
    <span class="key"><i style="border-color:var(--ok)"></i>developed</span><span class="key"><i style="border-color:var(--beacon)"></i>can develop now</span><span class="key"><i style="border-color:#4a6684"></i>available</span><span class="key"><i style="border-color:#2b3d52;opacity:.55"></i>needs earlier tech</span>
    <button class="b" data-tt-close>Back to the map</button></div>
    <div class="tt-wrap" style="width:${W}px;height:${H}px">${bands}<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${paths}</svg>${cardsH}</div>`;
}
function renderTree() {

function wire() {
  const P = $('panel'), on = (sel_, fn) => P.querySelectorAll(sel_).forEach(b => b.onclick = () => fn(b));
  const ship = () => sel && sel.t === 'ship' && G.ships.find(x => x.id === sel.id);

  on('[data-a="tabtech"]', () => { tab = 'tech'; render(); });
  on('[data-a="treeclose"]', () => { tab = 'turn'; render(); });
  on('[data-dip]', b => act(() => E.setDiplomacy(G, b.dataset.dip, +b.dataset.d)));
  P.querySelectorAll('[data-out]').forEach(s => s.onchange = () => { G.bases.find(b => b.id === s.dataset.out).out = s.value; save(); render(); });
  on('[data-a="transfer"]', () => { const f = $('tf-from').value, t = $('tf-to').value, ty = $('tf-type').value, n = +$('tf-n').value, nm = v => v === 'earth' ? 'Earth' : G.bases.find(x => x.id === v).name;
    ask(`Transfer ${n} ${ty}?`, `<p>From ${esc(nm(f))} to ${esc(nm(t))}.${f === 'earth' ? ` Bought on Earth for <b>$${n}B</b>.` : ''}${t === 'earth' ? ` Sold on Earth at 2 for $1B.` : ''}</p>`, () => E.transferRes(G, f, t, ty, n), 'Transfer'); });
  on('[data-pc]', b => act(() => { if (b.dataset.pc === 'allcash') { while (G.polm) E.convertPolitics(G, 'cash'); return null; } return E.convertPolitics(G, b.dataset.pc); }));
  on('[data-tp]', b => { const f = b.dataset.tp, buy = b.dataset.d === 'buy'; ask(buy ? `Buy 1 ${E.FN[f]} point?` : `Sell 2 ${E.FN[f]} points?`, `<p>${buy ? `Pay <b>$1B</b> (you have $${G.cash}B) for 1 ${E.FN[f]} point.` : `Trade 2 of your ${G.bank[f]} ${E.FN[f]} points for <b>$1B</b>.`}</p>`, () => E.tradePoints(G, f, b.dataset.d), buy ? 'Buy' : 'Sell'); });
  on('[data-pol]', b => { const p = D.POL.find(x => x.k === b.dataset.pol), lv = E.polLv(G, p.k); ask(`Adopt ${D.POL_LV[lv]}${p.n}?`, `<p>${esc(p.d[lv])}.</p><p class="dim">You can adopt one policy per decade.</p>`, () => E.choosePolicy(G, p.k), 'Adopt'); });
  on('[data-dev]', b => { const t = D.TECHK[b.dataset.dev], c = E.techCost(G, t); ask(`Develop ${t.n}?`, `<p>${esc(t.d)}.</p><p>Costs <b>${c} ${E.FN[t.f]} points</b> (you have ${G.bank[t.f]}).</p><p class="dim">${esc(E.techCostTxt(G, t))}.</p>`, () => E.develop(G, t.k), 'Develop'); });
  const lvAsk = (z, where) => { const bs = where === 'earth' ? null : G.bases.find(x => x.id === where); ask(`Build LV-${z}${bs ? ' at ' + bs.name : ''}?`, `<p>${costLine({ ORE: 1, FUEL: z }, bs)}</p><p class="dim">Two-sided counters: ${esc(E.lvPoolTxt(G))}.</p>`, () => E.buildLV(G, z, where), 'Build'); };
  on('[data-lv]', b => lvAsk(+b.dataset.lv, 'earth'));
  on('[data-lvscrap]', b => { const z = +b.dataset.lvscrap, w = b.dataset.where; ask(`Scrap LV-${z}?`, `<p>Half its materials come back${w === 'earth' ? ' onto your faction board' : ' to the base'}, and its two-sided counter is free again.</p>`, () => E.scrapLV(G, w, z), 'Scrap'); });
  on('[data-lvb]', b => lvAsk(+b.dataset.lvb, b.dataset.base));
  const unitAsk = (key, reserved) => { const o = E.buildOptions(G, 'earth').find(x => x.key === key); const cost = { ...o.cost }; if (reserved) { cost.SUP = Math.max(0, cost.SUP - 1); cost.FUEL = Math.max(0, cost.FUEL - 1); }
    ask(`Build ${o.kind} ${o.u.n}${reserved ? ' (reserved)' : ''}?`, `<div class="row">${cssCounter(key.split('|')[1] ? o.kind + '|' + o.u.n : '', 64)}<p class="dim" style="margin:0">Search ${o.u.ev}${o.u.spec ? ', spectrometer' : ''}${o.u.lab ? ', mobile lab' : ''}${o.u.cargo ? ' · cargo ' + o.u.cargo : ''}${o.u.cb ? ' · combat ' + o.u.cb : ''}</p></div><p>${costLine(cost, 'earth')}</p>${reserved ? '<p class="dim">Built on its reserved side: 1 SUP and 1 Fuel cheaper, and the first unreserve is included.</p>' : ''}${o.kind !== 'Probe' ? '<p class="dim">It still needs a launch vehicle to leave Earth.</p>' : ''}`, () => E.buildUnit(G, key, 'earth', reserved), 'Build'); };
  on('[data-build]', b => unitAsk(b.dataset.build, false));
  on('[data-buildr]', b => unitAsk(b.dataset.buildr, true));
  on('[data-unres]', b => { const s = G.ships.find(x => x.id == b.dataset.unres); ask(`Unreserve ${s.name}?`, `<p>Costs <b>$2B</b> on Earth, or 1 SUP and 1 Fuel at a base.</p>`, () => E.unreserve(G, s), 'Unreserve'); });
  on('[data-reserve]', b => act(() => E.setReserve(G, G.ships.find(s => s.id == b.dataset.reserve))));
  on('[data-repair]', b => { const s = G.ships.find(x => x.id == b.dataset.repair); ask(`Repair ${s.name}?`, `<p>${s.dmg} damage. Repairs cost 1 Ore per marker (on Earth from the faction board, or $1B each); the facility limits how many per turn.</p>`, () => E.repair(G, s), 'Repair'); });
  on('[data-sel]', b => { sel = { t: 'ship', id: +b.dataset.sel }; tab = 'sel'; render(); });
  on('[data-selb]', b => { sel = { t: 'base', id: b.dataset.selb }; tab = 'sel'; render(); });
  on('[data-mvto]', b => { const s = ship(); chooseAndMove(s, b.dataset.mvto, E.moves(G, s).filter(m => m.dest === b.dataset.mvto)); });
  on('[data-ex]', b => { const s = ship(); const o = E.exploreOptions(G, s)[+b.dataset.ex];
    if (o.kind === 'explore' || o.kind === 'probe') { ui = { k: 'confirm', s: s.id, o }; renderAsk(); return; }
    const room = s.cap * E.cargoMul(G) - E.sum(s.cargo);
    if (o.kind === 'produce') ask(`Produce ${o.res} at ${D.W[o.w].n}?`, `<p>${esc(s.name)} produces 1 ${o.res} automatically. Then roll a d10${E.has(G, 'ref') ? ' (−1 for Space Refining)' : ''}: ${o.value % 10 || o.value} or less adds 1 more, and a 1 adds another.</p><p class="dim">Production value ${o.value}. Cargo room ${room}. Then a recall check (${E.recall(G)}%).</p>`, () => E.explore(G, s, o), 'Produce');
    else ask('Harvest the asteroid?', `<p>${esc(s.name)} rolls a d10 on the asteroid harvest table: 1–3 SUP, 4–6 Fuel, 7–10 Ore (3 to 6 units), and earns 1 victory marker.</p><p class="dim">Cargo room ${room}. Then a recall check (${E.recall(G)}%).</p>`, () => E.explore(G, s, o), 'Harvest'); });
  on('[data-fskip]', b => act(() => E.flybySkip(G, ship())));
  { const lb = P.querySelector('[data-loadearth]'); if (lb) {
      let get = null; get = wireCargo(P, null, ok => { const L = get ? Object.fromEntries([...P.querySelectorAll('.cargo input[type=range]')].map(i => [i.dataset.r, +i.value])) : {}; lb.disabled = !ok || !E.sum(L); });
      lb.onclick = () => { const s = ship(), L = get(); act(() => { for (const r of ['ORE', 'SUP', 'FUEL']) if (L[r]) { const e = E.buyCargo(G, s, r, L[r]); if (e) return e; } return null; }); }; } }
  on('[data-buyc]', b => { const s = ship(), r = b.dataset.buyc; ask(`Load 1 ${r} into ${s.name}?`, `<p>${RS(r, 1)}: <b>${esc(E.earthCostTxt(G, { [r]: 1 }))}</b> (you have $${G.cash}B). It goes into ${esc(s.name)}'s hold.</p>`, () => E.buyCargo(G, s, r, 1), 'Load'); });
  on('[data-buyc5]', b => { const s = ship(), n = Math.min(G.cash + E.estock(G).SUP, s.cap * E.cargoMul(G) - E.sum(s.cargo)); ask(`Fill ${s.name} with SUP?`, `<p>${RS('SUP', n)}: <b>${esc(E.earthCostTxt(G, { SUP: n }))}</b> (you have $${G.cash}B).</p>`, () => E.buyCargo(G, s, 'SUP', n), 'Load'); });
  on('[data-sellc]', () => { const s = ship(); const got = ['ORE', 'SUP', 'FUEL'].reduce((a, r) => a + Math.floor(s.cargo[r] / 2), 0); ask(`Sell ${s.name}'s cargo?`, `<p>Earth buys 2 of a type for $1B: ${resHTML(s.cargo)} sells for <b>$${got}B</b>. Odd leftovers stay aboard.</p>`, () => E.sellCargo(G, s), 'Sell'); });
  on('[data-unload]', () => act(() => E.unload(G, ship(), E.atOwnBase(G, ship()))));
  on('[data-loadr]', b => act(() => E.load(G, ship(), E.atOwnBase(G, ship()), b.dataset.loadr, 99)));
  on('[data-found]', b => { const s = G.ships.find(x => x.id == b.dataset.found), c = E.canFoundBase(G, s); ask(`Found a base at ${D.W[c.w].n}?`, `<p>Uses <b>${c.cost} SUP</b> from ${esc(s.name)}'s hold (it carries ${s.cargo.SUP}). The base takes the next name on your faction sheet.</p>`, () => E.foundBase(G, s), 'Found base'); });
  on('[data-scrap]', b => { const s = G.ships.find(x => x.id == b.dataset.scrap); if (b.dataset.confirm) { act(() => E.scrap(G, s)); sel = null; } else { b.dataset.confirm = 1; b.textContent = 'Tap again to confirm'; } });
  const base = () => sel && sel.t === 'base' && G.bases.find(x => x.id === sel.id);
  on('[data-fac]', b => { const bs = base(), o = E.upgradeOptions(G, bs).find(x => x.c === b.dataset.fac); ask(`Build ${o.next.n} at ${bs.name}?`, `<p>${costLine(o.next.c, bs)}</p><p class="dim">Each base builds one facility level or settlement per turn.</p>`, () => E.buildFacility(G, bs, o.c), 'Build'); });
  on('[data-rf]', b => { const bs = base(); ask(`Repair at ${bs.name}?`, `<p>Removes 1 damage marker for 1 Ore from ${esc(bs.name)}'s stock (it has ${bs.stock.ORE}).</p>`, () => E.repairFacility(G, bs, b.dataset.rf), 'Repair'); });
  on('[data-settle]', () => { const bs = base(); ask(`Add a settlement at ${bs.name}?`, `<p>${costLine(D.SETTLE_COST, bs)}</p><p class="dim">${bs.name} has ${bs.set} settlement(s).</p>`, () => E.buildSettlement(G, bs), 'Build'); });
  on('[data-terra]', () => { const bs = base(), c = (E.has(G, 'atm') ? 3 : 4) + (G.turn.terraBuys[bs.id] || 0); ask(`Buy a terraforming point for ${D.W[bs.w].n}?`, `<p>Costs <b>${c} SUP</b> from ${esc(bs.name)} (it has ${bs.stock.SUP}). Each extra point this turn costs 1 SUP more.</p>`, () => E.terraform(G, bs), 'Buy'); });
  const tradeAsk = (where, tm, limit, title) => ask(title, `<p>${tm.side === 'buy' ? `Buy up to ${limit} ${tm.type} at 2 per $1B (you have $${G.cash}B).` : `Sell up to ${limit} ${tm.type} at $2B each.`}</p><p class="dim">The trade marker is used up after this trade.</p>`, () => E.trade(G, where, 99), tm.side === 'buy' ? 'Buy' : 'Sell');
  on('[data-tradeb]', b => { const bs = G.bases.find(x => x.id === b.dataset.tradeb); tradeAsk({ base: bs.id }, bs.trade, E.tradeLimitOwn(bs), `Trade at ${bs.name}?`); });
  on('[data-npft]', b => { const k = b.dataset.npft, x = G.w[k]; tradeAsk({ w: k }, x.npfTrade, (D.FAC[G.f].rel[G.rel[x.npf]] || [0, 0])[1], `Trade with ${D.FAC[x.npf].n} at ${D.W[k].n}?`); });
  on('[data-cb]', b => act(() => E.combatAct(G, E.combatOptions(G)[+b.dataset.cb])));
  on('[data-pub]', b => act(() => E.answer(G, b.dataset.pub)));
  on('[data-a="cargo"]', () => { const load = { ORE: +$('cf-ORE').value || 0, SUP: +$('cf-SUP').value || 0, FUEL: +$('cf-FUEL').value || 0 }, bs = G.bases.find(x => x.id === $('cf-base').value), lv = E.launchLVs(G, 'earth', 1)[0];
    ask(`Cargo flight to ${bs.name}?`, `<p>${resHTML(load)}${lv ? ` on LV-${lv.n} ${lv.stock ? 'from stock' : '(new)'}` : ''}: <b>${esc(E.earthCostTxt(G, lv && lv.buy ? { ORE: (load.ORE || 0) + 1, SUP: load.SUP || 0, FUEL: (load.FUEL || 0) + lv.n } : load))}</b>.</p><p class="dim">Engine failure ${E.engBase(G)}% loses the cargo.</p>`, () => E.shipCargo(G, bs.id, load), 'Launch'); });
}
boot().catch(e => { document.body.insertAdjacentHTML('beforeend', `<p style="position:fixed;left:16px;bottom:16px;color:#ef6b5b">The game failed to load: ${esc(e.message)}</p>`); console.error(e); });
</script>
