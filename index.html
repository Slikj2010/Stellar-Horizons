<meta charset="utf-8">
<title>Stellar Horizons Solo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jura:wght@500;700&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: full-screen star chart (canvas) with a command rail on the right and a status strip on top; phone: rail becomes a bottom sheet. Single dark look by design: the board art is a black starfield. */
:root {
  --void: #05080d; --hull: #0d141d; --hull2: #142030; --line: #263a50; --ink: #dfe7ee; --dim: #8ea1b3;
  --beacon: #f2a93b; --ion: #4fc3d9; --ok: #5fcf8a; --warn: #f2a93b; --bad: #ef6b5b;
  --phy: #4f9be6; --eng: #a9b4bf; --bio: #5fcf8a;
  --f-disp: "Jura", "Eurostile", "Segoe UI", sans-serif; --f-body: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif; --f-mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--void); color: var(--ink); font: 15px/1.45 var(--f-body); overflow: hidden; }
#app { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr; padding-top: env(safe-area-inset-top, 0px); }
#bar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; padding: 8px 16px; background: var(--hull); border-bottom: 1px solid var(--line); font-size: 13px; }
#bar .yr { font: 700 22px/1 var(--f-disp); letter-spacing: .06em; color: var(--beacon); }
#bar .ph { font: 600 13px var(--f-disp); letter-spacing: .12em; text-transform: uppercase; color: var(--ion); }
#bar .st { color: var(--dim); white-space: nowrap; } #bar .st b { color: var(--ink); font: 500 13px var(--f-mono); font-variant-numeric: tabular-nums; }
#bar .grow { flex: 1; }
#main { position: relative; display: grid; grid-template-columns: 1fr minmax(340px, 400px); min-height: 0; }
#stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--void); touch-action: none; }
#stage canvas { display: block; }
#zoom { position: absolute; left: 16px; bottom: 16px; display: flex; gap: 6px; }
#hint { position: absolute; left: 16px; top: 12px; right: 16px; pointer-events: none; font-size: 13px; color: var(--dim); text-shadow: 0 1px 2px #000; }
#rail { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; background: var(--hull); border-left: 1px solid var(--line); }
#tabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
#tabs button { flex: 1; padding: 9px 4px; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--dim); font: 600 12px var(--f-disp); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; }
#tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--beacon); }
#panel { overflow-y: auto; padding: 14px 16px 24px; min-height: 0; }
#foot { display: flex; gap: 8px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); background: var(--hull2); }
#foot .next { flex: 1; }
h2 { font: 700 17px/1.2 var(--f-disp); letter-spacing: .05em; margin: 0 0 6px; text-wrap: balance; }
h3 { font: 600 12px var(--f-disp); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin: 16px 0 6px; }
p { margin: 0 0 8px; } .dim { color: var(--dim); font-size: 13px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
button.b { font: 600 13px var(--f-body); padding: 7px 11px; border-radius: 4px; border: 1px solid var(--line); background: var(--hull2); color: var(--ink); cursor: pointer; }
button.b:hover:not(:disabled) { border-color: var(--ion); }
button.b.pri { background: var(--beacon); border-color: var(--beacon); color: #1b1203; }
button.b:disabled { opacity: .4; cursor: not-allowed; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--ion); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; }
.item { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.item .t { min-width: 0; } .item .t small { display: block; color: var(--dim); font-size: 12px; }
.chip { display: inline-block; padding: 1px 7px; border-radius: 10px; font: 600 11px var(--f-body); letter-spacing: .04em; border: 1px solid var(--line); color: var(--dim); }
.chip.ok { color: var(--ok); border-color: var(--ok); } .chip.warn { color: var(--warn); border-color: var(--warn); } .chip.bad { color: var(--bad); border-color: var(--bad); }
.f-Phy { color: var(--phy); } .f-Eng { color: var(--eng); } .f-Bio { color: var(--bio); }
.cnt { width: 40px; height: 40px; border-radius: 4px; background-repeat: no-repeat; flex: none; }
.rs { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 3px; font: 700 11px/1 var(--f-mono); color: #fff; vertical-align: middle; }
.rs.ORE { background: #6b7178; clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); } .rs.SUP { background: #2c7cc4; border-radius: 50%; } .rs.FUEL { background: linear-gradient(#f5b62a, #d9411e); border-radius: 50% 50% 45% 45%; }
table { border-collapse: collapse; width: 100%; font-size: 13px; } td, th { padding: 4px 6px; border-top: 1px solid var(--line); text-align: left; } th { color: var(--dim); font-weight: 500; }
.tech { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 6px 0; border-top: 1px solid var(--line); }
.tech small { color: var(--dim); font-size: 12px; grid-column: 1 / -1; }
.tech.have b { color: var(--ok); } .tech.locked { opacity: .55; }
#log p { font-size: 13px; margin: 0 0 6px; color: var(--dim); } #log p.g { color: var(--ink); } #log p.x { color: var(--bad); } #log p.e { color: var(--warn); } #log p.bot { color: #b7a6e6; font-size: 12.5px; } #log p.h { color: var(--ion); font-family: var(--f-disp); letter-spacing: .06em; margin-top: 12px; }
#modal { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(2,4,8,.7); z-index: 20; padding: 16px; }
#modal .box { max-width: 460px; width: 100%; background: var(--hull); border: 1px solid var(--beacon); border-radius: 6px; padding: 18px; max-height: 85vh; overflow: auto; }
#pick { position: fixed; inset: 0; overflow: auto; background: radial-gradient(ellipse at 30% 20%, #10213a 0, var(--void) 60%); z-index: 30; padding: 32px 16px; }
#pick .in { max-width: 920px; margin: 0 auto; }
#pick h1 { font: 500 clamp(32px, 6vw, 58px)/1 var(--f-disp); letter-spacing: .32em; margin: 0 0 6px; text-transform: uppercase; }
#pick .lede { color: var(--dim); max-width: 62ch; margin-bottom: 22px; }
.facs { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.fc { text-align: left; background: var(--hull); border: 1px solid var(--line); border-radius: 6px; padding: 14px; color: var(--ink); cursor: pointer; font: inherit; display: grid; gap: 6px; }
.fc:hover { border-color: var(--beacon); } .fc b { font: 700 16px var(--f-disp); letter-spacing: .04em; } .fc small { color: var(--dim); font-size: 13px; }
.fc .sw { height: 4px; border-radius: 2px; }
#toast { position: absolute; left: 50%; bottom: 70px; transform: translateX(-50%); background: var(--hull2); border: 1px solid var(--bad); color: var(--ink); padding: 8px 14px; border-radius: 4px; font-size: 13px; max-width: 80%; z-index: 5; }
#lvpick { position: absolute; z-index: 6; background: var(--hull); border: 1px solid var(--ion); border-radius: 6px; padding: 10px; display: grid; gap: 6px; }
.die { display: inline-grid; place-items: center; width: 52px; height: 52px; border-radius: 10px; font: 700 28px var(--f-mono); background: var(--hull2); border: 2px solid var(--line); flex: none; }
/* d100 face: round, smaller digits so 100 fits */
.die.d100 { border-radius: 50%; font-size: 21px; }
.die.ok { border-color: var(--ok); color: var(--ok); } .die.bad { border-color: var(--bad); color: var(--bad); }
#menu { position: fixed; inset: 0; z-index: 40; background: #02040a; overflow: hidden; }
#menu::before { content: ""; position: absolute; inset: -40px; background: url(menu.webp) center / cover; filter: blur(28px) brightness(.55); }
#menu .stage { position: absolute; transform-origin: 30% 58%; animation: kb 46s ease-in-out infinite alternate; }
@keyframes kb { from { transform: scale(1); } to { transform: scale(1.045) translate(-0.6%, 0.4%); } }
#menu img, #menu canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#menu .mb { position: absolute; background: transparent; border: 0; cursor: pointer; clip-path: polygon(6% 0, 94% 0, 100% 50%, 94% 100%, 6% 100%, 0 50%); }
#menu .mb::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(140,220,255,.38) 50%, transparent 70%); background-size: 260% 100%; background-position: 130% 0; opacity: 0; transition: opacity .2s; }
#menu .mb:hover::after, #menu .mb:focus-visible::after { opacity: 1; animation: sweep 1.1s ease-out; }
#menu .mb:hover, #menu .mb:focus-visible { box-shadow: inset 0 0 22px rgba(79,195,217,.55); outline: none; }
@keyframes sweep { from { background-position: 130% 0; } to { background-position: -30% 0; } }
#menu .panel { position: absolute; z-index: 3; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(520px, calc(100% - 32px)); max-height: calc(100% - 48px); overflow: auto; background: rgba(8,16,30,.92); border: 1px solid #3aa6d8; box-shadow: 0 0 40px rgba(58,166,216,.35); border-radius: 8px; padding: 20px; }
.slot { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.slot small { color: var(--dim); display: block; font-size: 12px; }
/* developer console */
#dev { position: fixed; right: 12px; bottom: 12px; z-index: 30; width: min(440px, calc(100% - 24px)); max-height: calc(100% - 24px); display: flex; flex-direction: column; background: #070c14f2; border: 1px solid #3aa6d8; border-radius: 8px; box-shadow: 0 0 30px rgba(58,166,216,.25); font: 12.5px var(--f-body); color: var(--ink); }
#dev[hidden] { display: none; }
#dev .dh { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
#dev .dh b { flex: 1; font: 600 12px var(--f-disp); letter-spacing: .2em; text-transform: uppercase; color: #7fd0f5; }
#dev .db { overflow: auto; padding: 8px 10px; display: grid; gap: 8px; }
#dev .dr { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
#dev .dr > span { width: 74px; color: var(--dim); }
#dev select, #dev input { background: #0d1520; color: var(--ink); border: 1px solid #2b3d52; border-radius: 4px; padding: 4px 6px; font: inherit; min-width: 0; }
#dev input[type=number] { width: 64px; }
#dev .dr select { flex: 1 1 0; max-width: 100%; } #dev .dr select[data-dv="pl"], #dev .dr select[data-dv="rl"] { flex: 0 0 auto; }
#dev .dout { height: 140px; overflow: auto; background: #03060b; border: 1px solid #1c2a3a; border-radius: 4px; padding: 6px; font: 11.5px/1.4 var(--f-mono); white-space: pre-wrap; }
#dev .dout .e { color: #f08a7a; } #dev .dout .c { color: #7fd0f5; }
#dev .dcmd { width: 100%; font-family: var(--f-mono) !important; }
#pause { position: fixed; inset: 0; z-index: 35; display: grid; place-items: center; background: rgba(2,5,12,.72); backdrop-filter: blur(3px); padding: 16px; }
#pause .box { width: min(420px, 100%); max-height: calc(100% - 32px); overflow: auto; background: var(--hull); border: 1px solid #3aa6d8; border-radius: 8px; padding: 20px; box-shadow: 0 0 40px rgba(58,166,216,.3); }
#pause .big { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 11px 14px; font: 600 14px var(--f-disp); letter-spacing: .14em; text-transform: uppercase; }
#pause h2 { letter-spacing: .3em; text-transform: uppercase; font-weight: 500; }
#bar .pz { font: 600 12px var(--f-disp); letter-spacing: .12em; padding: 5px 10px; }
.toggle { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.board-img { width: 100%; border-radius: 4px; border: 1px solid var(--line); }
/* zoom / inspect overlay */
#zov { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(2,4,8,.82); padding: 16px; }
#zov .zb { width: min(720px, 100%); max-height: calc(100% - 24px); overflow: auto; background: var(--hull); border: 1px solid var(--ion); border-radius: 8px; padding: 18px; position: relative; }
#zov .zx { position: absolute; right: 10px; top: 10px; }
#zov .zimg { display: grid; place-items: center; padding: 10px; background: #070b11; border: 1px solid var(--line); border-radius: 6px; margin: 8px 0; min-height: 200px; }
#zov .zimg .cnt, #zov .zimg .cardimg { image-rendering: auto; }
#zov .zgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
#zov .zcell { display: grid; gap: 4px; justify-items: center; text-align: center; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--hull2); font-size: 12.5px; }
#zov .zcell small { color: var(--dim); font-size: 11.5px; }
.zoomable { cursor: zoom-in; } .zoomable:hover { outline: 1px solid var(--ion); }
@media (max-width: 820px) {
  #main { grid-template-columns: 1fr; grid-template-rows: 1fr minmax(260px, 46%); }
  #rail { border-left: 0; border-top: 1px solid var(--line); }
  #bar { gap: 2px 12px; padding: 6px 16px; } #bar .yr { font-size: 18px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
/* technology tree (dark take on the printed Technology Tree) */
#ttree { position: absolute; inset: 0; z-index: 20; overflow: auto; touch-action: pan-x pan-y; background: #070b11; overscroll-behavior: contain; }
#ttree[hidden] { display: none !important; }
#ttree .tt-wrap { position: relative; margin: 0 auto; }
#ttree .band { position: absolute; left: 0; right: 0; }
#ttree .band.Bio { background: linear-gradient(90deg, #1f2a12, #141b0e 40%, #10150c); }
#ttree .band.Phy { background: linear-gradient(90deg, #13223a, #0e1829 40%, #0b1320); }
#ttree .band.Eng { background: linear-gradient(90deg, #22262c, #191c21 40%, #131619); }
#ttree .band + .band { border-top: 1px solid #2a3a4c; }
#ttree .blabel { position: absolute; left: 0; width: 64px; display: grid; place-items: center; }
#ttree .blabel span { writing-mode: vertical-rl; transform: rotate(180deg); font: 700 30px var(--f-disp); letter-spacing: .14em; text-transform: uppercase; }
#ttree .blabel.Bio span { color: #b5c46a; } #ttree .blabel.Phy span { color: #7fb2f0; } #ttree .blabel.Eng span { color: #b9c2cc; }
#ttree svg { position: absolute; left: 0; top: 0; pointer-events: none; }
#ttree .tcard { position: absolute; display: flex; flex-direction: column; gap: 3px; padding: 6px 8px 6px; border-radius: 6px; background: #0f1722; border: 1px solid #2b3d52; box-shadow: 0 2px 8px rgba(0,0,0,.5); cursor: pointer; text-align: left; color: var(--ink); font: 12px/1.25 var(--f-body); }
#ttree .tcard .tn { display: flex; align-items: flex-start; gap: 6px; font: 700 12.5px/1.15 var(--f-disp); letter-spacing: .02em; }
#ttree .tcard .tn b { flex: 1; font: inherit; }
#ttree .tcard .tc { flex: none; min-width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 700 12px var(--f-mono); color: #fff; border: 2px solid rgba(255,255,255,.35); }
#ttree .tcard.Bio .tc { background: #6f7d2c; } #ttree .tcard.Phy .tc { background: #2f69b3; } #ttree .tcard.Eng .tc { background: #59626d; }
#ttree .tcard .tc s { font-size: 9px; opacity: .7; margin-right: 1px; }
#ttree .tcard .td { color: var(--dim); font-size: 11.5px; flex: 1; }
#ttree .tcard .tf { display: flex; gap: 3px; flex-wrap: wrap; }
#ttree .tcard .tf i { font: 700 9px/1 var(--f-mono); font-style: normal; padding: 2px 3px; border-radius: 2px; color: #fff; }
#ttree .tcard.have { border-color: var(--ok); background: #10201a; } #ttree .tcard.have .tn b::after { content: " ✓"; color: var(--ok); }
#ttree .tcard.open { border-color: #4a6684; } #ttree .tcard.ready { border-color: var(--beacon); box-shadow: 0 0 0 1px var(--beacon), 0 0 14px rgba(242,169,59,.35); }
#ttree .tcard.locked { opacity: .55; }
#ttree .tcard:hover { border-color: var(--ion); opacity: 1; }
#ttree .tt-top { position: sticky; left: 0; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding: 10px 16px; background: rgba(7,11,17,.92); border-bottom: 1px solid var(--line); font-size: 13px; }
#ttree .tt-top h2 { margin: 0; font-size: 18px; letter-spacing: .2em; text-transform: uppercase; }
#ttree .tt-top .sp { flex: 1; }
#ttree .ptree { margin: 24px auto 0; }
#ttree .pbar { position: absolute; height: 26px; border-radius: 13px; background: linear-gradient(90deg, #1b2a3c, #22344a); opacity: .8; }
#ttree .parr { position: absolute; font: 700 22px/18px var(--f-disp); color: #6f8aa8; }
#ttree .pcard { justify-content: flex-start; }
#ttree .pcard.locked { opacity: 1; color: #7d8a99; border-color: #233244; } #ttree .pcard.locked .td { color: #5d6a78; } #ttree .pcard.locked .pl { color: #8a6a3a; }
#ttree .pcard .pl { font: 700 9.5px var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--beacon); }
#ttree .pstart { max-width: 820px; margin: 18px auto 24px; padding: 0 16px; font-size: 12px; text-align: center; }
#ttree .pcs { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; } #ttree .pcs .b { padding: 4px 9px; font-size: 12px; }
#ttree .fbanks { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 12px; }
#ttree .fb { padding: 2px 8px; border: 1px solid #22344a; border-radius: 4px; background: #0d1520; white-space: nowrap; } #ttree .fb .mono { margin-right: 4px; } #ttree .fb.cur { border-color: var(--beacon); } #ttree .fb.out { opacity: .55; } #ttree .fb i { font-style: normal; color: var(--dim); }
#ttree .rt { font-size: 12.5px; } #ttree .rt b { color: var(--beacon); }
#ttree .key { display: inline-flex; align-items: center; gap: 5px; color: var(--dim); }
#ttree .key i { width: 14px; height: 10px; border-radius: 2px; border: 2px solid; display: inline-block; }
#pick .scen { display: grid; gap: 8px; margin: 6px 0 6px; }
#pick .fc.on { outline: 2px solid var(--beacon); outline-offset: 1px; }
#pick .fc:disabled { opacity: .45; cursor: default; }
#pick .botrow { margin: 6px 0; align-items: center; } #pick .botrow .sw { display: inline-block; }
#pick .botrow .sw { width: 14px; height: 14px; border-radius: 3px; }
#pick h3 { margin-top: 18px; }
#pick .scen .sc { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--hull); cursor: pointer; }
#pick .scen .sc:has(input:checked) { border-color: var(--beacon); }
#pick .scen .sc input { margin-top: 3px; accent-color: var(--beacon); }
#pick .scen .sc span { display: grid; gap: 2px; } #pick .scen small { color: var(--dim); font-size: 12.5px; }
#mbox .cargo, #panel .cargo { margin: 8px 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--hull2); }
.pcd .sl { grid-template-columns: 96px 1fr 28px 74px !important; }
.misrow { display: flex; gap: 10px; align-items: center; margin: 6px 0; } .misrow .cardimg { flex: none; border-radius: 4px; }
.kept { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0; } .kept > div { display: flex; flex-direction: column; align-items: center; gap: 2px; } .kept .cardopt { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.cargo .sl { display: grid; grid-template-columns: auto 44px 1fr 28px; align-items: center; gap: 8px; margin: 4px 0; font-size: 13px; }
.cargo input[type=range] { width: 100%; accent-color: #e8892f; }
.hexc { display: inline-grid; place-items: center; min-width: 26px; height: 22px; padding: 0 4px; font: 700 11px/1 var(--f-mono); color: #fff; background: #d9772a; clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); vertical-align: middle; }
.initord { margin: 6px 0 10px; padding-left: 22px; } .initord li { margin: 2px 0; font-weight: 600; }
p.order { margin: -2px 0 10px; }
.cardpick { display: flex; flex-wrap: wrap; gap: 14px; margin: 10px 0; }
.cardpick.small { opacity: .8; margin-top: 0; }
.cardopt { display: grid; gap: 6px; justify-items: center; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--hull2); color: var(--ink); font: 600 13px var(--f-body); cursor: pointer; }
.cardopt:hover, .cardopt:focus-visible { border-color: var(--beacon); }
.cardimg { display: block; background-repeat: no-repeat; max-width: 100%; }
.fbar { display: grid; gap: 6px; margin: 4px 0 8px; position: sticky; top: 0; z-index: 1; background: var(--hull); padding: 4px 0; }

// politics markers → cash / tech points: one slider per target, together at most the markers you hold
function pcClick() {
  if (!G.polm) return;
  const n = E.polLv(G, 'dip') >= 3 ? 3 : 2, max = G.polm, T = [['cash', 'Cash', 1, '$', 'B'], ...E.FIELDS.map(f => [f, E.FN[f], n, '', ' pts'])];
  let vals = {};
  const body = `<p class="dim">You hold <b>${max}</b> politics marker${max > 1 ? 's' : ''}. Each becomes $1B or ${n} tech points of one field. Together the sliders use at most ${max}.</p>
    <div class="cargo pcd">${T.map(([k, nm]) => `<label class="sl"><span class="${k === 'cash' ? '' : 'f-' + k}">${nm}</span><input type="range" min="0" max="${max}" value="0" data-k="${k}" aria-label="${nm}"><b class="mono" data-v="${k}">0</b><span class="dim" data-g="${k}"></span></label>`).join('')}
    <p data-sum style="margin:6px 0 0"></p></div>`;
  ui = { k: 'gen', title: 'Convert politics markers', body, go: 'Convert', after: box => {
    const ins = [...box.querySelectorAll('.pcd input')], go = box.querySelector('[data-ui="gen"]');
    const upd = moved => {
      let tot = ins.reduce((a, i) => a + +i.value, 0);
      if (tot > max && moved) { moved.value = +moved.value - (tot - max); tot = max; }
      vals = Object.fromEntries(ins.map(i => [i.dataset.k, +i.value]));
      T.forEach(([k, , per, pre, suf]) => { box.querySelector(`[data-v="${k}"]`).textContent = vals[k]; box.querySelector(`[data-g="${k}"]`).textContent = vals[k] ? `→ +${pre}${vals[k] * per}${suf}` : ''; });
      box.querySelector('[data-sum]').innerHTML = tot ? `Converting <b>${tot}</b> of ${max} markers; ${max - tot} left.` : '<span class="dim">Move a slider to choose.</span>';
      go.disabled = !tot;
    };
    ins.forEach(i => i.oninput = () => upd(i)); upd();
  }, fn: () => {
    for (const [k] of T) for (let i = 0; i < (vals[k] || 0); i++) { const e = E.convertPolitics(G, k); if (e) return e; }
    return null;
  } };
  renderAsk();
}

      lvSel.onchange = setup; setup();
    } }
  on('[data-a="cargo"]', () => { const sl = $('cf-sl'), load = sl && sl.getLoad ? sl.getLoad() : {}, bs = G.bases.find(x => x.id === $('cf-base').value), lv = E.launchLVs(G, 'earth', 1).find(x => x.n === +$('cf-lv').value);
    if (!E.sum(load)) { toast('Set some cargo with the sliders first.'); return; }
    ask(`Cargo flight to ${bs.name}?`, `<p>${resHTML(load)}${lv ? ` on LV-${lv.n} ${lv.stock ? 'from stock' : '(new)'}` : ''}: <b>${esc(E.earthCostTxt(G, lv && lv.buy ? { ORE: (load.ORE || 0) + 1, SUP: load.SUP || 0, FUEL: (load.FUEL || 0) + lv.n } : load))}</b>.</p><p class="dim">Engine failure ${E.engBase(G)}% loses the cargo.</p>`, () => E.shipCargo(G, bs.id, load, lv && lv.n), 'Launch'); });
}
boot().catch(e => { document.body.insertAdjacentHTML('beforeend', `<p style="position:fixed;left:16px;bottom:16px;color:#ef6b5b">The game failed to load: ${esc(e.message)}</p>`); console.error(e); });
</script>
