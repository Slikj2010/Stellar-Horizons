name: Build desktop apps
# Run by hand to just build installers (downloadable from the run). To publish to a release that installed copies update from,
# either push a tag like v1.1.0, or run by hand and type an existing release tag (for example v1.0.0) into "release_tag".
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Upload the builds to this existing release tag (leave empty to only build)'
        required: false
        default: ''
  push:
    tags: ['v*']
permissions:
  contents: write
env:
  TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Version from tag
        if: env.TAG != ''
        shell: bash
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version
        working-directory: desktop
      - run: npm install
        working-directory: desktop
      - name: Build and publish to the release
        if: env.TAG != ''
        run: npx electron-builder --publish always
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build only
        if: env.TAG == ''
        run: npx electron-builder --publish never
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        if: env.TAG == ''
        with:
          name: stellar-horizons-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
